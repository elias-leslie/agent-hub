version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
      routine-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
      routine-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: [minor, patch]
      routine-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
