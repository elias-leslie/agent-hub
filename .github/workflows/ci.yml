name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_hub_app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agent_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_hub_app -d agent_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENT_HUB_DB_URL: postgresql://agent_hub_app:test@localhost:5432/agent_hub_test
      TEST_AGENT_HUB_DB_URL: postgresql://agent_hub_app:test@localhost:5432/agent_hub_test
      # HATCHET_CLIENT_TOKEN is intentionally unset: tests/conftest.py supplies a
      # structurally-valid dummy JWT via setdefault(). Setting it here overrides that,
      # and any non-decodable value makes the Hatchet SDK reject it at import time
      # (pytest then exits 4 before collection).
      HATCHET_CLIENT_TLS_STRATEGY: none
      INTERNAL_SERVICE_SECRET: agent-hub-internal-v1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install backend dependencies
        run: uv sync --all-extras --dev
      - name: Lint backend
        run: uv run ruff check .
      - name: Typecheck backend
        run: uv run ty check app
      - name: Test backend
        run: uv run pytest
      - name: Build backend package
        run: uv build

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm --filter frontend lint
      - name: Typecheck frontend
        run: pnpm --filter frontend exec tsc --noEmit
      - name: Test frontend
        run: pnpm --filter frontend exec vitest run
      - name: Build frontend
        run: pnpm --filter frontend build
