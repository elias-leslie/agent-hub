name: CI

on:
  workflow_call:
    secrets:
      CODEX_CONFIG_READ_KEY:
        required: true
      CLAUDE_CONFIG_READ_KEY:
        required: true
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector image (postgres 16 + the `vector` extension) — migrations run
        # `CREATE EXTENSION vector`, which the stock postgres:16-alpine lacks.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent_hub_app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agent_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_hub_app -d agent_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AGENT_HUB_DB_URL: postgresql://agent_hub_app:test@localhost:5432/agent_hub_test
      TEST_AGENT_HUB_DB_URL: postgresql://agent_hub_app:test@localhost:5432/agent_hub_test
      # HATCHET_CLIENT_TOKEN is intentionally unset: tests/conftest.py supplies a
      # structurally-valid dummy JWT via setdefault(). Setting it here overrides that,
      # and any non-decodable value makes the Hatchet SDK reject it at import time
      # (pytest then exits 4 before collection).
      HATCHET_CLIENT_TLS_STRATEGY: none
      INTERNAL_SERVICE_SECRET: agent-hub-internal-v1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install backend dependencies
        run: uv sync --locked --all-extras --dev
      - name: Lint backend
        run: uv run ruff check .
      - name: Typecheck backend
        run: uv run ty check app
      - name: Migrate test database
        # The postgres service starts empty. Tests that boot the app via the
        # TestClient lifespan load credentials from the DB; against an unmigrated
        # schema credential_manager retries 5x (~15s) then errors, so every such
        # test ERRORs. Build the schema first.
        run: uv run alembic upgrade head
      - name: Test backend
        run: uv run pytest -m "not private_context"
      - name: Build backend package
        run: uv build

  private-context-integration:
    runs-on: ubuntu-24.04
    env:
      # Required at app import; adapter tests use isolated subprocess fixtures, not DB I/O.
      AGENT_HUB_DB_URL: postgresql://agent_hub_app:test@localhost:5432/agent_hub_test
      CONTEXT_CONFIG_ROOT: ${{ github.workspace }}/.ci-config
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Checkout Codex adapter sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: elias-leslie/codex-config
          ref: 48062d964a9083a91e7716d699a8f3d427cc067b
          path: .ci-config/codex-config
          ssh-key: ${{ secrets.CODEX_CONFIG_READ_KEY }}
          persist-credentials: false
      - name: Checkout Claude adapter sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: elias-leslie/claude-config
          # Portable context adapters; default branch contains workstation symlinks.
          ref: fc24af5d1405330ca2c3c95234fbf04dca3be6d8
          path: .ci-config/claude-config
          ssh-key: ${{ secrets.CLAUDE_CONFIG_READ_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install adapter test dependencies
        run: uv sync --locked --all-extras --dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test private context adapters
        run: uv run pytest tests/integrations/test_context_delivery_adapters.py -m private_context --no-cov

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify workspace packages
        run: |
          pnpm --dir packages/passport-client pack --pack-destination "$RUNNER_TEMP/package-artifacts"
          pnpm --dir packages/chat-ui pack --pack-destination "$RUNNER_TEMP/package-artifacts"
          pnpm --filter @summitflow/notes-ui build
          node packages/pack-smoke.mjs "$RUNNER_TEMP/package-artifacts/agent-hub-chat-ui-0.1.0.tgz" "$RUNNER_TEMP/package-artifacts/agent-hub-passport-client-0.1.0.tgz"
      - name: Lint frontend
        run: pnpm --filter frontend lint
      - name: Typecheck frontend
        run: pnpm --filter frontend exec tsc --noEmit
      - name: Test frontend
        run: pnpm --filter frontend exec vitest run
      - name: Build frontend
        run: pnpm --filter frontend build
