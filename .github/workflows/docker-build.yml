name: Build & Push Docker Images
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag override'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODEX_CONFIG_READ_KEY: ${{ secrets.CODEX_CONFIG_READ_KEY }}
      CLAUDE_CONFIG_READ_KEY: ${{ secrets.CLAUDE_CONFIG_READ_KEY }}

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            dockerfile: docker/backend.Dockerfile
            image-suffix: api
          - component: frontend
            dockerfile: docker/frontend.Dockerfile
            image-suffix: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/elias-leslie/agent-hub-${{ matrix.image-suffix }}:latest
            ghcr.io/elias-leslie/agent-hub-${{ matrix.image-suffix }}:${{ inputs.tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
