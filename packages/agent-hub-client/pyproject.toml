[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hub-client"
version = "0.4.0"
description = "Python client SDK for Agent Hub API"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Agent Hub"},
]
keywords = ["agent-hub", "llm", "api", "sdk", "claude", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "ty>=0.0.17",
]

[project.urls]
Homepage = "https://github.com/elias-leslie/agent-hub"
Documentation = "https://github.com/elias-leslie/agent-hub/tree/main/packages/agent-hub-client"
Repository = "https://github.com/elias-leslie/agent-hub"

[tool.hatch.build.targets.wheel]
packages = ["agent_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.rules]
# Suppress beta-quality rules (ty 0.0.x false positives)
invalid-argument-type = "ignore"
unknown-argument = "ignore"
unresolved-import = "ignore"
