[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agent-hub-st"
version = "0.1.0"
description = "Agent Hub-owned commands and client helpers for SummitFlow ST"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "PyYAML>=6.0.0",
    "summitflow-st-sdk==0.1.0",
    "typer>=0.15.0",
]

[project.scripts]
agent-hub-st = "agent_hub_st.__main__:main"

[tool.uv.sources]
summitflow-st-sdk = { path = "../../docker/workspace-packages/summitflow_st_sdk-0.1.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["agent_hub_st"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
