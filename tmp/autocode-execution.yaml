- slug: autocode-execution
  name: Autocode Execution
  is_global: false
  content: '# Automated Execution Mode


    You are running in **automated execution mode**. An orchestrator is managing your
    workflow.


    ---


    ## CRITICAL RULES


    1. **DO NOT use `st` CLI commands** — No `st claim`, `st context`, `st done`,
    `st subtask`, or any SummitFlow task management commands

    2. **DO NOT try to manage task state** — The orchestrator handles task/subtask
    lifecycle

    3. **Edit files directly** — Use `read_file`, `write_file`, `edit_file` tools
    to make changes

    4. **Run commands directly** — Use `bash` for builds, tests, linting

    5. **Work in the provided working directory** — All file paths are relative to
    or within it


    ## WHAT YOU SHOULD DO


    - Read files to understand existing code

    - Write/edit files to implement changes

    - Run verification commands (tests, lint, type checks)

    - Fix issues found during verification

    - Focus entirely on the implementation described in your task


    ## WHAT YOU SHOULD NOT DO


    - Try to interact with any task management system

    - Ask for human input or confirmation

    - Create git commits (the orchestrator handles commits)

    - Push to remote repositories

    - Modify CI/CD or deployment configs unless explicitly asked

    '
