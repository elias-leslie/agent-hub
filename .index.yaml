project: agent-hub
generated_at: 2026-02-06 21:29 UTC
environment:
  python_version: '>=3.13'
  venv_path: backend/.venv
  package_manager: npm
services:
  backend_port: 8003
  frontend_port: 3003
  infrastructure:
    neo4j: 7687
    postgres: 5432
    redis: 6379
cli:
  common_commands:
  - 'st complete --agent <slug> <prompt>  # Route to agent'
  - 'st memory save <content>  # Save learning to memory'
  - 'st memory search <query>  # Semantic search'
pages:
- / (app)
- /access-control (access-control)
- /access-control/clients (clients)
- /access-control/clients/:id (clients/:id)
- /access-control/clients/new (new)
- /admin (admin)
- /agents (agents)
- /agents/:slug (agents/:slug)
- /agents/:slug/analytics (analytics)
- /chat (chat)
- /dashboard (dashboard)
- /memory (memory)
- /monitoring/requests (requests)
- /sessions (sessions)
- /sessions/:id (sessions/:id)
endpoints:
- DELETE /admin/request-audit (clear_request_audit)
- DELETE /admin/unknown-callers (clear_unknown_callers)
- GET /admin/db/tables/{table_name}/count (get_table_count)
- GET /admin/db/tables/{table_name}/sample (get_table_sample)
- GET /agents/{slug}/versions (get_agent_versions)
- GET /llm-config (get_llm_config)
- GET /memory/analytics (get_analytics)
- GET /memory/capture/stream (capture_stream)
- GET /memory/continuity (get_continuity_context)
- GET /memory/episode/{episode_id}/citations (get_episode_citations)
- GET /memory/episode/{episode_id}/similar (get_similar_episodes)
- GET /memory/sessions-with-memory (get_sessions_with_memory_endpoint)
- GET /memory/timeline (get_timeline)
- GET /metrics (metrics)
- GET /status/cache (status_cache_info)
- POST /memory/sessions/{session_id}/summarize (summarize_session)
tables:
- agent_versions
- agents
- api_keys
- client_controls
- clients
- cost_logs
- credentials
- global_instructions
- memory_injection_metrics
- memory_settings
- request_logs
- session_events
- sessions
- tier_change_log
- truncation_events
- usage_stats
- webhook_subscriptions
tasks:
- cleanup_stale_sessions_task (every 5 minutes)
- run_tier_optimizer (crontab(hour=2, minute=0))
folders:
  (root): 13 files
  .claude: 2 files
  .qna-session: 1 files
  .st: 1 files
  backend: 466 files - api, services, tests
  examples: 6 files
  frontend: 300 files - api, components, tests
  packages: 37 files - components, tests
  scripts: 16 files - services, tests
