project: agent-hub
generated_at: 2026-02-14 15:06 UTC
environment:
  python_version: '>=3.13'
  venv_path: backend/.venv
  package_manager: npm
services:
  backend_port: 8003
  frontend_port: 3003
  infrastructure:
    neo4j: 7687
    postgres: 5432
    redis: 6379
cli:
  common_commands:
  - 'st complete --agent <slug> <prompt>  # Route to agent'
  - 'st memory save <content>  # Save learning to memory'
  - 'st memory search <query>  # Semantic search'
pages:
- / (app)
- /access-control (access-control)
- /access-control/clients (clients)
- /access-control/clients/:id (clients/:id)
- /access-control/clients/new (new)
- /admin (admin)
- /agents (agents)
- /agents/:slug (agents/:slug)
- /agents/:slug/analytics (analytics)
- /chat (chat)
- /dashboard (dashboard)
- /memory (memory)
- /models (models)
- /monitoring/requests (requests)
- /prompts (prompts)
- /prompts/:slug (prompts/:slug)
- /prompts/new (new)
- /sessions (sessions)
- /sessions/:id (sessions/:id)
endpoints:
- DELETE /admin/request-audit (clear_request_audit)
- DELETE /admin/unknown-callers (clear_unknown_callers)
- GET /admin/db/tables/{table_name}/count (get_table_count)
- GET /admin/db/tables/{table_name}/sample (get_table_sample)
- GET /agents/{slug}/versions (get_agent_versions)
- GET /analytics (get_analytics)
- GET /analytics/top-memories (get_top_memories_endpoint)
- GET /capture/stream (capture_stream)
- GET /continuity (get_continuity_context)
- GET /entities (list_entities)
- GET /entities/{entity_name}/episodes (get_entity_episodes)
- GET /episode/{episode_id}/citations (get_episode_citations)
- GET /episode/{episode_id}/similar (get_similar_episodes)
- GET /llm-config (get_llm_config)
- GET /metrics (metrics)
- GET /scopes (list_memory_scopes)
- GET /sessions-with-memory (get_sessions_with_memory_endpoint)
- GET /status/cache (status_cache_info)
- GET /timeline (get_timeline)
- POST /sessions/{session_id}/analyze (analyze_session)
- POST /sessions/{session_id}/summarize (summarize_session)
- POST /sessions/{session_id}/task-outcome (report_task_outcome)
- POST /task-outcome (report_task_outcome_by_task)
- PUT /prompts/agents/{agent_slug}/assignments/{prompt_slug} (update_assignment_endpoint)
tables:
- agent_prompts
- agent_versions
- agents
- api_keys
- client_controls
- clients
- cost_logs
- credentials
- global_instructions
- memory_injection_metrics
- memory_settings
- prompts
- request_logs
- session_events
- sessions
- tier_change_log
- truncation_events
- usage_stats
- user_preferences
- webhook_subscriptions
tasks:
- cleanup_stale_sessions_task (every 5 minutes)
- run_memory_cleanup (crontab(hour=3, minute=0, day_of_week="sunday"))
- run_tier_optimizer (crontab(hour=2, minute=0))
folders:
  (root): 15 files
  .claude: 2 files
  .dev-tools: 9 files - tests
  .qna-session: 1 files
  .st: 4 files
  backend: 656 files - api, services, tests
  examples: 6 files
  frontend: 457 files - api, components, tests
  packages: 47 files - components, tests
  scripts: 15 files - services, tests
