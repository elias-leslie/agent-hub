# Agent host sshd settings, installed by scripts/remote-host/host/setup as
# /etc/ssh/sshd_config.d/50-agent-host.conf. Every remote terminal, paste,
# health check and status command is one session on the Tether link's single
# connection, so the default of 10 sessions per connection is far too few.
MaxSessions 100
# Notice a dead link within about 45 s.
ClientAliveInterval 15
ClientAliveCountMax 3
