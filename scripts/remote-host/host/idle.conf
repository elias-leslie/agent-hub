# Agent host idle poweroff (read by agent-host-idle). The timer runs it every
# 5 minutes; the host powers off once every condition has held this long.
# Installed to /etc/agent-host/idle.conf when that file is missing; later runs
# only add keys it lacks, so edits there survive bootstrap re-runs.
ENABLED=1
IDLE_MINUTES=15
# Load average must stay below LOAD_MAX, read over LOAD_WINDOW (1, 5 or 15) minutes.
LOAD_MAX=0.3
LOAD_WINDOW=5
TETHER_SOCKET=/run/user/1000/tether/default/control.sock
# Any other process in a user slice is user work and keeps the host up (a
# detached job uses little CPU), except in these units (globs, matched against
# each unit in its cgroup path) and with these command names. Tether's own
# units are left out because its sessions are counted above; its pane scopes
# (tmux-spawn-*) are not, so work left running after a session ends counts.
IGNORE_UNITS=init.scope tether@*.service aico-tmux-server-*.service aico-tmux-server-*.scope tether-*-tmux-server-*.service dbus.service dbus-broker.service pipewire*.service wireplumber.service gpg-agent*.service ssh-agent.service at-spi-dbus-bus.service xdg-*.service gvfs-*.service
IGNORE_COMMANDS=sshd sshd-session sshd-auth
# Running containers and root `systemd-run` jobs (transient units in
# system.slice) keep the host up too, except these units (globs); a
# container's own scope is already counted as a container.
IGNORE_SYSTEM_UNITS=docker-*.scope
