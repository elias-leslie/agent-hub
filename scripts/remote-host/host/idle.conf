# Agent host idle poweroff (read by agent-host-idle). The timer runs it every
# 5 minutes; the host powers off once every condition has held this long.
# Installed to /etc/agent-host/idle.conf only when that file is missing, so
# edits there survive bootstrap re-runs.
ENABLED=1
IDLE_MINUTES=15
# Load average must stay below LOAD_MAX, read over LOAD_WINDOW (1, 5 or 15) minutes.
LOAD_MAX=0.3
LOAD_WINDOW=5
TETHER_SOCKET=/run/user/1000/tether/default/control.sock
