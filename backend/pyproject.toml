[project]
name = "agent-hub"
version = "0.1.0"
description = "Unified agentic AI service for Claude/Gemini workloads"
requires-python = ">=3.13"
dependencies = [
    # Core API framework
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Database
    "sqlalchemy>=2.0.0",
    # HTTP client
    "httpx>=0.28.0",
    # Background tasks
    "hatchet-sdk>=1.22.0",
    "redis>=5.0.0",
    # AI integrations
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "claude-agent-sdk>=0.1.19", # OAuth via Claude CLI (zero API cost)
    "google-genai>=1.0.0", # Gemini API client
    "graphiti-core[google-genai]>=0.26.0", # Knowledge graph for memory system
    "tiktoken>=0.7.0", # Token counting for context management
    # Retry logic
    "tenacity>=8.2.0",
    # Security
    "cryptography>=43.0.0",
    "bcrypt>=4.0.0",
    # JSON validation
    "jsonschema>=4.20.0",
    # CLI output formatting
    # Voice
    "edge-tts>=6.1.0", # TTS
    "faster-whisper>=1.0.0", # STT
    # Observability
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "asyncpg>=0.31.0",
]

[project.optional-dependencies]
dev = [
    # Testing - Core
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    # Testing - Essential Plugins
    "pytest-mock>=3.15.0",
    "pytest-timeout>=2.4.0",
    "pytest-randomly>=3.16.0",
    # Linting & Type Checking
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "types-jsonschema>=4.26.0",
    "types-redis>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = [
    "faster_whisper", "faster_whisper.*",
    "asyncpg", "asyncpg.*",
    "graphiti_core", "graphiti_core.*",
    "hatchet_sdk", "hatchet_sdk.*",
    "tiktoken", "tiktoken.*",
    "edge_tts", "edge_tts.*",
    "google", "google.*",
    "anthropic", "anthropic.*",
    "claude_agent_sdk", "claude_agent_sdk.*",
    "tenacity", "tenacity.*",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "integration: marks tests as integration tests (requires database/services)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
