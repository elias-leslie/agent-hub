[project]
name = "agent-hub"
version = "0.1.0"
description = "Unified agentic AI service for routed AI workloads"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    # Core API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.16.0",
    # HTTP client
    "httpx>=0.28.0",
    "ddgs>=9.9.0",
    "trafilatura>=2.0.0",
    # Background tasks
    "hatchet-sdk>=1.22.0",
    "redis>=5.0.0",
    # AI integrations
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0", # Gemini API client
    "pgvector>=0.3.0", # PostgreSQL pgvector for memory embeddings
    "numpy<2.4", # Keep wheels compatible with older x86_64 hosts
    "tiktoken>=0.7.0", # Token counting for context management
    "croniter>=1.3.0", # Cron expression parsing for scheduled jobs
    # Retry logic
    "tenacity>=8.2.0",
    # Security
    "cryptography>=48.0.1",
    # JSON validation
    "jsonschema>=4.20.0",
    # Web Push notifications
    "pywebpush>=2.0.0",
    # Telegram bot
    "python-telegram-bot>=22.6,<23",
    # Voice
    "edge-tts>=6.1.0", # TTS
    "faster-whisper>=1.0.0", # STT
    # Observability
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "asyncpg>=0.31.0",
    "rank-bm25>=0.2.2",
    "playwright>=1.57.0",
]

[project.scripts]
web-research = "app.cli.web_research:main"

[project.optional-dependencies]
# Opt-in tool-result compression engine (Rust ext: headroom._core). We call the
# SmartCrusher / LogCompressor transforms directly — never headroom.compress — so
# the engine's heavy core deps (litellm, ast-grep-cli) are neutralized below via
# [tool.uv] override-dependencies. Base install omits this group, so the import in
# app/llm/headroom_compress.py fails safe and compression no-ops.
compression = [
    "headroom-ai==0.23.0",
]
dev = [
    # Testing - Core
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    # Testing - Essential Plugins
    "pytest-mock>=3.15.0",
    "pytest-timeout>=2.4.0",
    "pytest-randomly>=3.16.0",
    # Linting & Type Checking
    "ruff>=0.15.0",
    "import-linter>=2.0.0",
    "ty>=0.0.17",
    "types-jsonschema>=4.26.0",
    "types-redis>=4.6.0",
]

[tool.uv]
# The `compression` extra pulls headroom-ai, whose core deps include litellm
# (forbidden by the single-adapter mandate) and ast-grep-cli (a large binary we
# never invoke). The transforms-only path imports neither, so drop both from
# resolution with a never-satisfiable marker — the package edge stays, but nothing
# installs them on any platform.
override-dependencies = [
    "litellm==1.82.3; sys_platform == 'no-such-platform'",
    "ast-grep-cli==0.39.5; sys_platform == 'no-such-platform'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.ty.rules]
# Suppress beta-quality rules (ty 0.0.x false positives)
# Remove these as ty matures past 0.1
invalid-argument-type = "ignore"  # dict unpacking, ParamSpec middleware
unknown-argument = "ignore"       # structlog bound logger kwargs
unresolved-import = "ignore"      # self-imports from packages, lazy imports

[tool.ty.src]
# Keep the type gate focused on runtime code while ty is still beta. Tests and
# operational scripts are covered by pytest and dedicated script tests.
exclude = ["tests/**", "scripts/**"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "LLM providers are private to the llm package"
type = "forbidden"
source_modules = [
    "app.adapters",
    "app.api",
    "app.cli",
    "app.constants",
    "app.core",
    "app.memory",
    "app.middleware",
    "app.models",
    "app.routing",
    "app.scripts",
    "app.services",
    "app.storage",
    "app.tasks",
    "app.utils",
    "app.workflows",
]
forbidden_modules = ["app.llm.providers"]

[tool.pytest.ini_options]
markers = [
    "unit: marks tests as unit tests (fast, no external dependencies)",
    "integration: marks tests as integration tests (requires database/services)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
